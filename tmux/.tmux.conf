# ==========================================
# Terminal
# ==========================================

# Use tmux's terminal definition inside tmux
set -g default-terminal "tmux-256color"

# Enable true color support for the outer terminal
set -ga terminal-features ",xterm-256color:RGB"

# Enable focus events
set -g focus-events on

# Reduce escape delay
set -s escape-time 0

# ==========================================
# Prefix
# ==========================================

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ==========================================
# Status Bar
# ==========================================

set -g status-style 'bg=#333333 fg=#5eacd3'

# ==========================================
# General
# ==========================================

bind r source-file ~/.tmux.conf
set -g base-index 1
set-window-option -g mode-keys vi

# ==========================================
# Copy Mode
# ==========================================

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# ==========================================
# Pane / Window Navigation
# ==========================================

# vim-like pane switching
# bind -r ^ last-window
# bind -r k select-pane -U
# bind -r j select-pane -D
# bind -r h select-pane -L
# bind -r l select-pane -R

# ==========================================
# TODO
# ==========================================

bind -r D neww -c "#{pane_current_path}" \
  "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

# ==========================================
# Sessionizer / Cheatsheet
# ==========================================

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
bind-key -r i run-shell "tmux neww ~/.local/scripts/tmux-cht.sh"

