# Enable true-color support for terminals using screen-256color.
set -ga terminal-overrides ",screen-256color*:Tc"

# Use a 256-color terminal by default.
set-option -g default-terminal "screen-256color"

# Remove the default delay when tmux waits to see whether Escape is
# part of a key sequence. This makes Vim/Neovim feel more responsive.
set -s escape-time 0


# ---------------------------------------------------------------------------
# Prefix key
# ---------------------------------------------------------------------------

# Unbind the default tmux prefix (Ctrl-b).
unbind C-b

# Use Ctrl-a as the tmux prefix instead.
set-option -g prefix C-a

# Allow Ctrl-a Ctrl-a to send a literal Ctrl-a to the current program.
bind-key C-a send-prefix


# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------

# Set the status bar background and foreground colors.
set -g status-style 'bg=#333333 fg=#5eacd3'


# ---------------------------------------------------------------------------
# General settings
# ---------------------------------------------------------------------------

# Reload this configuration with: Ctrl-a r
bind r source-file ~/.tmux.conf

# Start window numbering at 1 instead of 0.
set -g base-index 1


# ---------------------------------------------------------------------------
# Copy mode
# ---------------------------------------------------------------------------

# Use Vim-style keybindings while navigating tmux copy mode.
set-window-option -g mode-keys vi

# Start a selection with 'v', just like Vim visual mode.
bind -T copy-mode-vi v send-keys -X begin-selection

# Copy the selection to the system clipboard with 'y', then exit copy mode.
# xclip must be installed for this to work.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'


# ---------------------------------------------------------------------------
# Vim-like pane switching
# ---------------------------------------------------------------------------

# Ctrl-a Ctrl-h/j/k/l move between panes like Vim.
# The '-r' flag allows the key to be repeated without pressing the prefix
# again.

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R


# ---------------------------------------------------------------------------
# TODO
# ---------------------------------------------------------------------------

# Ctrl-a D opens TODO.md from the current pane's directory if it exists.
# Otherwise, open the global personal TODO file.
#
# The new window starts in the current pane's working directory.
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"


# ---------------------------------------------------------------------------
# Sessionizer
# ---------------------------------------------------------------------------

# Ctrl-a f opens the tmux sessionizer in a new window.
#
# "Forget the find window" — the sessionizer handles finding/switching
# to projects instead.
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"


# ---------------------------------------------------------------------------
# cht.sh cheat sheets
# ---------------------------------------------------------------------------

# Ctrl-a i opens the interactive cht.sh lookup script in a new window.
bind-key -r i run-shell "tmux neww ~/.local/scripts/tmux-cht.sh"


# ---------------------------------------------------------------------------
# Project-specific sessionizer shortcuts
# ---------------------------------------------------------------------------

# These shortcuts are currently disabled.
# Each one would open the sessionizer directly in a specific project.

bind-key -r G run-shell "~/.local/scripts/tmux-sessionizer ~/.config/nvim"
bind-key -r C run-shell "~/.local/scripts/tmux-sessionizer ~/.dotfiles"
